tokens:
  gho_test_token_admin:
    login: admin
    scopes: [repo, user, admin:org, admin:repo_hook]
  gho_test_token_octocat:
    login: octocat
    scopes: [repo, user, read:user, "user:email", workflow]

github:
  users:
    - login: octocat
      name: The Octocat
      email: octocat@github.com
      bio: I am the Octocat
      company: GitHub
      location: San Francisco
    - login: developer
      name: Developer
      email: dev@example.com
  orgs:
    - login: my-org
      name: My Organization
      description: A test organization
  repos:
    - owner: octocat
      name: hello-world
      description: My first repository
      language: JavaScript
      topics: [hello, world]
      auto_init: true
    - owner: my-org
      name: org-repo
      description: An organization repository
      language: TypeScript
      auto_init: true
  apps:
    - app_id: 12345
      slug: my-github-app
      name: My GitHub App
      private_key: |
        -----BEGIN RSA PRIVATE KEY-----
        ...your PEM key...
        -----END RSA PRIVATE KEY-----
      permissions:
        contents: read
        issues: write
      events: [push, pull_request, issues]
      webhook_url: http://localhost:3000/webhooks/github
      webhook_secret: my-webhook-secret
      installations:
        - installation_id: 100
          account: octocat
          repository_selection: all
  oauth_apps:
    - client_id: emu_github_client_id
      client_secret: emu_github_client_secret
      name: Code App
      redirect_uris:
        - http://localhost:3000/api/auth/callback/github

vercel:
  users:
    - username: developer
      name: Developer
      email: dev@example.com
  teams:
    - slug: my-team
      name: My Team
  projects:
    - name: my-app
      team: my-team
      framework: nextjs
  integrations:
    - client_id: emu_vercel_client_id
      client_secret: emu_vercel_client_secret
      name: Code App (Vercel)
      redirect_uris:
        - http://localhost:3000/api/auth/callback/vercel

google:
  users:
    - email: testuser@gmail.com
      name: Test User
    - email: dev@example.com
      name: Developer
  oauth_clients:
    - client_id: emu_google_client_id
      client_secret: emu_google_client_secret
      name: Code App (Google)
      redirect_uris:
        - http://localhost:3000/api/auth/callback/google
  labels:
    - id: Label_ops
      user_email: testuser@gmail.com
      name: Ops/Review
      color_background: "#DDEEFF"
      color_text: "#111111"
  messages:
    - id: msg_welcome
      user_email: testuser@gmail.com
      from: welcome@example.com
      to: testuser@gmail.com
      subject: Welcome to the Gmail emulator
      body_text: You can now test Gmail, Calendar, and Drive flows locally.
      label_ids:
        - INBOX
        - UNREAD
        - CATEGORY_UPDATES
      date: 2025-01-04T10:00:00.000Z
  calendars:
    - id: primary
      user_email: testuser@gmail.com
      summary: testuser@gmail.com
      primary: true
      selected: true
      time_zone: UTC
  calendar_events:
    - id: evt_kickoff
      user_email: testuser@gmail.com
      calendar_id: primary
      summary: Project Kickoff
      start_date_time: 2025-01-10T09:00:00.000Z
      end_date_time: 2025-01-10T09:30:00.000Z
  drive_items:
    - id: drv_docs
      user_email: testuser@gmail.com
      name: Docs
      mime_type: application/vnd.google-apps.folder
      parent_ids:
        - root

auth0:
  users:
    - email: user@example.com
      email_verified: true
      password: Password123!
      name: Test User
      connection: Username-Password-Authentication
      roles: [admin]
  clients:
    - client_id: auth0_emulate_client
      client_secret: auth0_emulate_secret
      name: My Auth0 App
      app_type: regular_web
      callbacks:
        - http://localhost:3000/api/auth/callback
      allowed_logout_urls:
        - http://localhost:3000
      grant_types: [authorization_code, refresh_token, client_credentials, password]
  connections:
    - name: Username-Password-Authentication
      strategy: auth0
  resource_servers:
    - name: My API
      identifier: https://api.example.com
      scopes: [read:items, write:items]
      # enforce_policies turns on RBAC: access tokens for this API gain a
      # `permissions` claim derived from the user's roles + direct grants.
      enforce_policies: true
  client_grants:
    - client_id: auth0_emulate_client
      audience: https://api.example.com
      scopes: [read:items, write:items]
  roles:
    - name: admin
      description: Administrator
      # Permissions this role grants on an API (surface in the permissions claim).
      permissions:
        - resource_server_identifier: https://api.example.com
          permission_name: read:items
  # Permissions granted directly to a user (independent of roles).
  user_permissions:
    - user: user@example.com
      resource_server_identifier: https://api.example.com
      permission_name: write:items
  organizations:
    - name: acme
      display_name: Acme Inc
      members: [user@example.com]
  # Extensibility: Actions run on login (and other triggers). Provide a
  # declarative `config` (no code) or real JS `code` executed in a sandbox.
  actions:
    - name: add-department-claim
      trigger: post-login
      config:
        addClaims:
          idToken:
            "https://example.com/department": engineering
    - name: enrich-from-code
      trigger: post-login
      code: |
        exports.onExecutePostLogin = async (event, api) => {
          api.idToken.setCustomClaim("https://example.com/source", "action");
        };
  # Legacy Rules (executed JS) are supported for older tenants.
  rules:
    - name: add-country
      script: |
        function (user, context, callback) {
          context.idToken["https://example.com/country"] = "US";
          callback(null, user, context);
        }
  # MFA enforcement policy. always_on challenges every login; you can also
  # scope it to specific connections or users.
  mfa:
    always_on: false
    required_connections: []
    required_users: []
  breached_passwords: [password, 123456, qwerty]
